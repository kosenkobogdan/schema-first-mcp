services:
  - type: web
    name: schema-first-mcp
    runtime: docker
    plan: free
    healthCheckPath: /plan
    envVars:
      - key: NODE_ENV
        value: production
      - key: FFMPEG_PATH
        value: /usr/bin/ffmpeg
      - key: WHISPER_BIN
        value: /usr/local/bin/whisper-cli
      - key: WHISPER_MODEL
        value: /models/ggml-tiny.bin
